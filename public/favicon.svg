<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M32 4 C48 4, 58 10, 58 18 C58 40, 46 54, 32 60 C18 54, 6 40, 6 18 C6 10, 16 4, 32 4 Z" fill="url(#shieldGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Inner Legal Scales / Check Balance Symbol -->
  <!-- Center Pillar / Gavel Line -->
  <rect x="30" y="16" width="4" height="28" rx="2" fill="url(#goldGrad)"/>
  
  <!-- Horizontal Balance Bar -->
  <rect x="16" y="22" width="32" height="3.5" rx="1.5" fill="url(#goldGrad)"/>
  
  <!-- Left Scale Pan -->
  <path d="M14 34 Q21 34 21 27 L14 27 Z" fill="#94a3b8"/>
  <line x1="17.5" y1="23.5" x2="17.5" y2="28" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Right Scale Pan (Verified Checkmark) -->
  <path d="M43 34 Q50 34 50 27 L43 27 Z" fill="#94a3b8"/>
  <line x1="46.5" y1="23.5" x2="46.5" y2="28" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Verification Check Accent -->
  <path d="M26 44 L31 49 L42 38" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
